<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西风哨</title>
<link rel="stylesheet" href="style.css">
<style>
  .gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0b1f3a,#123a5e);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .gate-box{background:#fff;border-radius:14px;padding:34px 30px;width:300px;max-width:86vw;
    text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.38);}
  .gate-mark{width:54px;height:54px;border-radius:13px;background:#c0392b;color:#fff;font-size:27px;
    font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .gate-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
  .gate-sub{font-size:13px;color:#8a9099;margin-bottom:20px;}
  .gate-input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d8dde3;
    border-radius:8px;font-size:15px;margin-bottom:12px;outline:none;}
  .gate-input:focus{border-color:#1f6feb;}
  .gate-btn{width:100%;padding:11px;border:0;border-radius:8px;background:#1f6feb;color:#fff;
    font-size:15px;cursor:pointer;}
  .gate-btn:hover{background:#185fc7;}
  .gate-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px;}
</style>
</head>
<body>

<!-- 进入门禁 -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-mark">西</div>
    <div class="gate-title">西风哨</div>
    <div class="gate-sub">请输入访问密码</div>
    <input type="password" id="gateInput" class="gate-input" placeholder="密码" autocomplete="off">
    <button id="gateBtn" class="gate-btn">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- 可折叠报头 -->
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandBtn" title="回到最新一日">
      <span class="brand-mark">西</span>
      <span class="brand-name">西风哨</span>
    </button>
    <div class="topbar-meta" id="topMeta"></div>
    <button class="collapse-btn" id="collapseBtn" title="折叠 / 展开">▾</button>
  </div>
  <div class="topbar-detail" id="topDetail"></div>
</header>

<div class="layout">
  <!-- 左侧导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="nav-label">每日文档</div>
    <nav class="nav-days" id="navDays"></nav>

    <div class="nav-label">情报视图</div>
    <div class="nav-extra">
      <button class="nav-item" id="navArchive">全档案情报</button>
      <button class="nav-item" id="navSearch">搜索</button>
    </div>

    <div class="search-panel" id="searchPanel" hidden>
      <input type="search" id="searchInput" placeholder="搜标题 / 摘要 / 记者 / 信源 / 议题…">
      <div class="search-scope" id="searchScope"></div>
    </div>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="main"></main>
</div>

<!-- 详情弹层 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<footer class="footer">
  <p>西风哨 · 数据存于本机 <code>data/articles/</code>，每日扫描归档；站点为只读情报视图。</p>
  <p class="footer-dim" id="footerMeta"></p>
</footer>

<script src="data/index.js"></script>
<script src="gate.js"></script>
</body>
</html>
